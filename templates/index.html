<!DOCTYPE html>
<html>
<head>
  <title>Secure File Transfer Demo</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
    h2 { margin-top: 0; }
    pre { background: #f4f4f4; padding: 0.75rem; min-height: 3rem; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Hybrid Key Encapsulation Demo</h1>

  <section>
    <h2>1. SHA-256 integrity check</h2>
    <input id="text" placeholder="Type some text">
    <button onclick="hashIt()">Hash</button>
    <pre id="hash-out">Hash result will appear here.</pre>
  </section>

  <section>
    <h2>2. Generate hybrid session key</h2>
    <button onclick="makeKey()">Generate key</button>
    <pre id="key-out">Session key will appear here.</pre>
  </section>

  <script>
    async function show(url, outputId) {
      const res = await fetch(url);
      document.getElementById(outputId).textContent =
        JSON.stringify(await res.json(), null, 2);
    }
    function hashIt() {
      const text = document.getElementById("text").value;
      show("/hash?text=" + encodeURIComponent(text), "hash-out");
    }
    function makeKey() { show("/generate-key", "key-out"); }
  </script>
</body>
</html>
