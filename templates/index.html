<!DOCTYPE html>
<html>
<head><title>Secure File Transfer Demo</title></head>
<body>
  <h1>Hybrid Key Encapsulation Demo</h1>

  <h2>1. SHA-256 integrity check</h2>
  <input id="text" placeholder="Type some text">
  <button onclick="hashIt()">Hash</button>

  <h2>2. Generate hybrid session key</h2>
  <button onclick="makeKey()">Generate key</button>

  <pre id="out"></pre>

  <script>
    async function show(url) {
      const res = await fetch(url);
      document.getElementById("out").textContent =
        JSON.stringify(await res.json(), null, 2);
    }
    function hashIt() {
      show("/hash?text=" + encodeURIComponent(document.getElementById("text").value));
    }
    function makeKey() { show("/generate-key"); }
  </script>
</body>
</html>
